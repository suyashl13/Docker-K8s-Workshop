apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: nginx-pod-2
  name: nginx-pod-2
spec:
  automountServiceAccountToken: false
  containers:
  - image: nginx:1.25.4
    name: nginx-pod-2
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
        ephemeral-storage: "128Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
        ephemeral-storage: "256Mi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
